version: "3.9"

services:
  mongo:
    image: mongo:7.0
    container_name: replybridge_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: replybridge
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: replybridge_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/deploy/Dockerfile.api
    container_name: replybridge_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017/replybridge
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/apps/api/src   # hot-reload in dev

  workers:
    build:
      context: .
      dockerfile: infra/deploy/Dockerfile.workers
    container_name: replybridge_workers
    restart: unless-stopped
    ports:
      - "9090:9090"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017/replybridge
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/deploy/Dockerfile.web
    container_name: replybridge_web
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - .env
    depends_on:
      - api

volumes:
  mongo_data:
  redis_data:
